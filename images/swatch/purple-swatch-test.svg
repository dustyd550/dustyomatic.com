<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200"><rect x="0" y="0" width="1600" height="1200" fill="#ffffff"/><text x="48" y="60" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#000000">Purple Swatch Test</text><text x="48" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">Whichever block looks most like purple on-device is your closest facsimile</text><rect x="48" y="120" width="1504" height="172" fill="#d81b60"/><text x="72" y="212" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#ffffff">A — Magenta Reference</text><text x="1528" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" text-anchor="end">#d81b60</text><rect x="48" y="292" width="1504" height="172" fill="#86198f"/><text x="72" y="384" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#ffffff">B — Deep Purple, red-leaning</text><text x="1528" y="384" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" text-anchor="end">#86198f</text><rect x="48" y="464" width="1504" height="172" fill="#9333ea"/><text x="72" y="556" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#ffffff">C — Purple</text><text x="1528" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" text-anchor="end">#9333ea</text><rect x="48" y="636" width="1504" height="172" fill="#7c3aed"/><text x="72" y="728" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#ffffff">D — Balanced Purple</text><text x="1528" y="728" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" text-anchor="end">#7c3aed</text><rect x="48" y="808" width="1504" height="172" fill="#6366f1"/><text x="72" y="900" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#ffffff">E — Bright Purple, blue-leaning</text><text x