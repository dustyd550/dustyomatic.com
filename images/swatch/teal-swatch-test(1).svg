<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200"><rect x="0" y="0" width="1600" height="1200" fill="#ffffff"/><text x="48" y="60" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#000000">Teal Swatch Test</text><text x="48" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">Whichever block looks most like teal on-device is your closest facsimile</text><rect x="48" y="120" width="1504" height="172" fill="#1a73e8"/><text x="72" y="212" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">A — Current Blue (reference)</text><text x="1528" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#1a73e8</text><rect x="48" y="292" width="1504" height="172" fill="#0e7490"/><text x="72" y="384" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">B — Deep Teal, blue-leaning</text><text x="1528" y="384" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#0e7490</text><rect x="48" y="464" width="1504" height="172" fill="#0891b2"/><text x="72" y="556" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">C — Cyan Teal</text><text x="1528" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#0891b2</text><rect x="48" y="636" width="1504" height="172" fill="#0d9488"/><text x="72" y="728" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">D — Balanced Teal</text><text x="1528" y="728" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#0d9488</text><rect x="48" y="808" width="1504" height="172" fill="#14b8a6"/><text x="72" y="900" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">E — Bright Teal, green-leaning</text><text x="1528" y="900" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#14b8a6</text><rect x="48" y="980" width="1504" height="172" fill="#34a853"/><text x="72" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">F — Pure Green (reference)</text><text x="1528" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#34a853</text></svg>
