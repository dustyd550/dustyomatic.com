<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600"><rect x="0" y="0" width="1200" height="1600" fill="#ffffff"/><text x="48" y="60" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#000000">Teal Swatch Test</text><text x="48" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">Whichever block looks most like teal on-device is your closest facsimile</text><rect x="48" y="120" width="1104" height="183.33333333333334" fill="#1a73e8"/><text x="48" y="337.33333333333337" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#000000">A — Current Blue (reference)</text><text x="1152" y="337.33333333333337" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#1a73e8</text><rect x="48" y="363.33333333333337" width="1104" height="183.33333333333334" fill="#0e7490"/><text x="48" y="580.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#000000">B — Deep Teal, blue-leaning</text><text x="1152" y="580.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#0e7490</text><rect x="48" y="606.6666666666667" width="1104" height="183.33333333333334" fill="#0891b2"/><text x="48" y="824.0000000000001" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#000000">C — Cyan Teal</text><text x="1152" y="824.0000000000001" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#0891b2</text><rect x="48" y="850" width="1104" height="183.33333333333334" fill="#0d9488"/><text x="48" y="1067.3333333333333" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#000000">D — Balanced Teal</text><text x="1152" y="1067.3333333333333" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#0d9488</text><rect x="48" y="1093.3333333333335" width="1104" height="183.33333333333334" fill="#14b8a6"/><text x="48" y="1310.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#000000">E — Bright Teal, green-leaning</text><text x="1152" y="1310.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#14b8a6</text><rect x="48" y="1336.6666666666667" width="1104" height="183.33333333333334" fill="#34a853"/><text x="48" y="1554" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#000000">F — Pure Green (reference)</text><text x="1152" y="1554" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#34a853</text></svg>
