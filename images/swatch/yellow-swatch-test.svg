<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200"><rect x="0" y="0" width="1600" height="1200" fill="#ffffff"/><text x="48" y="60" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#000000">Yellow Swatch Test</text><text x="48" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">Whichever block looks most like yellow on-device is your closest facsimile</text><rect x="48" y="120" width="1504" height="172" fill="#b8860b"/><text x="72" y="212" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">A — Deep Mustard, orange-leaning</text><text x="1528" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#b8860b</text><rect x="48" y="292" width="1504" height="172" fill="#c9a227"/><text x="72" y="384" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">B — Gold Reference (native-leaning)</text><text x="1528" y="384" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#c9a227</text><rect x="48" y="464" width="1504" height="172" fill="#d4af17"/><text x="72" y="556" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">C — Golden Yellow</text><text x="1528" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#d4af17</text><rect x="48" y="636" width="1504" height="172" fill="#cfa422"/><text x="72" y="728" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">D — Balanced Yellow</text><text x="1528" y="728" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#cfa422</text><rect x="48" y="808" width="1504" height="172" fill="#d6c136"/><text x="72" y="900" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">E — Bright Yellow, green-leaning</text><text x="1528" y="900" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#d6c136</text><rect x="48" y="980" width="1504" height="172" fill="#808000"/><text x="72" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#000000">F — Olive Reference</text><text x="1528" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="end">#808000</text></svg>
